# ============================================================
# CampusConnect — Root / Shared Configuration
# ============================================================
spring.application.name=campus-connect-backend

# Active Profile — defaults to 'dev' for local developer convenience
# Set to 'prod' in production environments (e.g. SPRING_PROFILES_ACTIVE=prod)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Server Port — uses hosting platform PORT environment variable if available, else 8080
server.port=${PORT:8080}

# File Upload / Multipart Limits
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Token expiration in milliseconds (default: 24 hours)
app.jwt.expiration-ms=${JWT_EXPIRATION:86400000}

# Error response safety — never expose stack traces or binding errors
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
