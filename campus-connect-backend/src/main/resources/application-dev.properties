# ============================================================
# CampusConnect — Development Profile (dev)
# ============================================================

# MySQL Database (local development defaults with env variable overrides)
spring.datasource.url=${DB_URL:${CAMPUS_DB_URL:jdbc:mysql://localhost:3306/campus_connect_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}}
spring.datasource.username=${DB_USERNAME:${CAMPUS_DB_USERNAME:root}}
spring.datasource.password=${DB_PASSWORD:${CAMPUS_DB_PASSWORD:root}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate (auto-updates schema in development)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT Configuration (development fallback key)
app.jwt.secret=${JWT_SECRET:CampusConnectSecretKeyForJwtSigningMustBeAtLeast32CharsLong2024}

# CORS Allowed Origins (comma-separated list of allowed origins)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173}

# Demo Data Seeder (enabled by default for local development)
app.seeder.enabled=${APP_SEEDER_ENABLED:true}

# File Upload Storage (local directory)
app.upload.dir=${APP_UPLOAD_DIR:${UPLOAD_DIR:uploads/study-materials}}

# Logging
logging.level.com.campusconnect=DEBUG
logging.level.org.springframework.security=INFO
