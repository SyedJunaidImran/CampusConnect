# ============================================================
# CampusConnect — Production Profile (prod)
# ============================================================

# MySQL Database (Required environment variables — no insecure fallbacks)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate (Safe non-destructive mode: validate schema matches entities; set to update on first deployment)
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT Configuration (Must be provided via environment variable — at least 256 bits)
app.jwt.secret=${JWT_SECRET}

# CORS Allowed Origins (Must specify production frontend URL, e.g. https://campusconnect.vercel.app)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# Demo Data Seeder (Disabled by default in production)
app.seeder.enabled=${APP_SEEDER_ENABLED:false}

# File Upload Storage
app.upload.dir=${APP_UPLOAD_DIR:uploads/study-materials}

# Production Logging (Clean, performant, no debug noise)
logging.level.com.campusconnect=INFO
logging.level.root=WARN
