# ============================================================
# CampusConnect — Test Profile Configuration
# ============================================================
spring.datasource.url=jdbc:h2:mem:campus_connect_test;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

app.jwt.secret=TestingSecretKeyForCampusConnectUnitTestingMustBe32CharsLong!
app.jwt.expiration-ms=3600000
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000
app.seeder.enabled=false
app.upload.dir=target/test-uploads
logging.level.com.campusconnect=INFO
